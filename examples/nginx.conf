user www-data;
worker_processes 8;
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
  worker_connections 10000;
  multi_accept on;
}

http {
  sendfile on;
  tcp_nopush on;
  types_hash_max_size 2048;
  server_tokens off; # 建议改成 off，隐藏版本信息

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  access_log /var/log/nginx/access.log;

  # ========== Gzip（作为 Brotli 不支持时的回退） ==========
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss application/rss+xml image/svg+xml font/woff font/woff2;

  # ========== Brotli ==========
  brotli on;
  brotli_comp_level 6;
  brotli_static on; # 如果有预压缩的 .br 文件会优先使用
  brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss application/rss+xml image/svg+xml font/woff font/woff2;

  proxy_http_version 1.1;
  proxy_set_header Connection "";

  # 虚拟主机配置
  include /data/deploy/nginx/conf.d/*.conf;
}


# ========== Stream（TCP / UDP 转发） ==========
stream {
  # 引入 stream 配置目录
  include /data/deploy/nginx/stream.d/*.conf;
}

